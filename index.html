<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体重記録アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { 
            LineChart, Line, XAxis, YAxis, CartesianGrid, 
            Tooltip, ResponsiveContainer, ReferenceLine 
        } = Recharts;

        // LucideアイコンをReactコンポーネントとして使うためのラッパー
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const [svg, setSvg] = useState('');
            useEffect(() => {
                const icon = lucide.icons[name];
                if (icon) {
                    const svgString = lucide.createSvg(icon, {
                        class: className,
                        'stroke-width': 2
                    });
                    setSvg(svgString);
                }
            }, [name, className]);
            return <span dangerouslySetInnerHTML={{ __html: svg }} className="inline-block" />;
        };

        function WeightTracker() {
            const APP_VERSION = '1.0.1';
            
            const [records, setRecords] = useState([]);
            const [weight, setWeight] = useState('');
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [time, setTime] = useState(new Date().toTimeString().slice(0, 5));
            const [memo, setMemo] = useState('');
            const [goalWeight, setGoalWeight] = useState('');
            const [height, setHeight] = useState('');
            const [showSettings, setShowSettings] = useState(false);
            const [reminderTime, setReminderTime] = useState('08:00');
            const [reminderEnabled, setReminderEnabled] = useState(false);
            const [period, setPeriod] = useState('all');
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const [showCalendar, setShowCalendar] = useState(false);
            const [showUpdateNotice, setShowUpdateNotice] = useState(false);

            useEffect(() => {
                const saved = localStorage.getItem('weightRecords');
                const savedGoal = localStorage.getItem('goalWeight');
                const savedHeight = localStorage.getItem('height');
                const savedReminder = localStorage.getItem('reminderTime');
                const savedReminderEnabled = localStorage.getItem('reminderEnabled');
                const savedVersion = localStorage.getItem('appVersion');
                
                if (saved) setRecords(JSON.parse(saved));
                if (savedGoal) setGoalWeight(savedGoal);
                if (savedHeight) setHeight(savedHeight);
                if (savedReminder) setReminderTime(savedReminder);
                if (savedReminderEnabled) setReminderEnabled(savedReminderEnabled === 'true');
                
                if (savedVersion !== APP_VERSION) {
                    setShowUpdateNotice(true);
                    localStorage.setItem('appVersion', APP_VERSION);
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('weightRecords', JSON.stringify(records));
            }, [records]);

            const saveSettings = () => {
                if (goalWeight) localStorage.setItem('goalWeight', goalWeight);
                if (height) localStorage.setItem('height', height);
                localStorage.setItem('reminderTime', reminderTime);
                localStorage.setItem('reminderEnabled', reminderEnabled.toString());
                setShowSettings(false);
            };

            const addRecord = () => {
                if (!weight || !date || !time) return;
                const newRecord = {
                    date,
                    time,
                    datetime: `${date} ${time}`,
                    weight: parseFloat(weight),
                    memo: memo || '',
                    id: Date.now()
                };
                const updated = [...records, newRecord].sort((a, b) => new Date(a.datetime) - new Date(b.datetime));
                setRecords(updated);
                setWeight('');
                setMemo('');
            };

            const confirmDelete = () => {
                if (deleteConfirm) {
                    setRecords(records.filter(r => r.id !== deleteConfirm.id));
                    setDeleteConfirm(null);
                }
            };

            const exportData = () => {
                const csv = ['日付,時刻,体重(kg),BMI,メモ'];
                records.forEach(r => {
                    const bmi = height ? (r.weight / Math.pow(parseFloat(height) / 100, 2)).toFixed(1) : '';
                    csv.push(`${r.date},${r.time},${r.weight},${bmi},${r.memo}`);
                });
                const blob = new Blob([csv.join('\n')], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `体重記録_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
            };

            const getFilteredRecords = () => {
                if (period === 'all') return records;
                const cutoff = new Date();
                if (period === 'week') cutoff.setDate(cutoff.getDate() - 7);
                else if (period === 'month') cutoff.setMonth(cutoff.getMonth() - 1);
                else if (period === 'three-months') cutoff.setMonth(cutoff.getMonth() - 3);
                return records.filter(r => new Date(r.datetime) >= cutoff);
            };

            const filteredRecords = getFilteredRecords();

            const calculateAverage = (data, days) => {
                if (data.length === 0) return null;
                const cutoff = new Date();
                cutoff.setDate(cutoff.getDate() - days);
                const recent = data.filter(r => new Date(r.datetime) >= cutoff);
                if (recent.length === 0) return null;
                return recent.reduce((sum, r) => sum + r.weight, 0) / recent.length;
            };

            const stats = filteredRecords.length > 0 ? {
                current: filteredRecords[filteredRecords.length - 1].weight,
                start: filteredRecords[0].weight,
                change: filteredRecords[filteredRecords.length - 1].weight - filteredRecords[0].weight,
                weekAvg: calculateAverage(records, 7),
                monthAvg: calculateAverage(records, 30)
            } : null;

            const currentBMI = stats && height ? (stats.current / Math.pow(parseFloat(height) / 100, 2)).toFixed(1) : null;
            const goalDiff = stats && goalWeight ? (stats.current - parseFloat(goalWeight)) : null;
            const progress = stats && goalWeight && stats.start !== parseFloat(goalWeight) 
                ? Math.min(100, Math.max(0, ((stats.start - stats.current) / (stats.start - parseFloat(goalWeight))) * 100))
                : null;

            const getConsecutiveDays = () => {
                if (records.length === 0) return 0;
                const today = new Date();
                today.setHours(0,0,0,0);
                const sortedDates = [...new Set(records.map(r => r.date))].sort((a, b) => new Date(b) - new Date(a));
                let consecutive = 0;
                let checkDate = new Date(today);
                while (true) {
                    const dateStr = checkDate.toISOString().split('T')[0];
                    if (sortedDates.includes(dateStr)) {
                        consecutive++;
                        checkDate.setDate(checkDate.getDate() - 1);
                    } else break;
                }
                return consecutive;
            };

            const getCalendarData = () => {
                const today = new Date();
                const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
                const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);
                const days = [];
                for (let i = 0; i < firstDay.getDay(); i++) days.push(null);
                for (let d = 1; d <= lastDay.getDate(); d++) {
                    const dateStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const dayRecord = records.find(r => r.date === dateStr);
                    days.push({ date: d, dateStr, record: dayRecord, isToday: dateStr === today.toISOString().split('T')[0] });
                }
                return days;
            };

            const consecutiveDays = getConsecutiveDays();

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 font-sans">
                    <div className="max-w-5xl mx-auto">
                        {showUpdateNotice && (
                            <div className="fixed top-4 right-4 bg-green-500 text-white px-6 py-4 rounded-xl shadow-2xl z-50 flex items-center gap-3">
                                <span className="text-xl">✨</span>
                                <div><b>アップデート完了！</b> v{APP_VERSION}</div>
                                <button onClick={() => setShowUpdateNotice(false)}>×</button>
                            </div>
                        )}

                        {deleteConfirm && (
                            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                                <div className="bg-white rounded-2xl p-6 max-w-md w-full">
                                    <h3 className="text-xl font-bold mb-4">削除しますか？</h3>
                                    <div className="bg-gray-50 p-4 rounded-xl mb-6">
                                        {deleteConfirm.date} - {deleteConfirm.weight}kg
                                    </div>
                                    <div className="flex gap-3">
                                        <button onClick={() => setDeleteConfirm(null)} className="flex-1 py-3 bg-gray-200 rounded-xl">キャンセル</button>
                                        <button onClick={confirmDelete} className="flex-1 py-3 bg-red-600 text-white rounded-xl">削除</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="bg-white rounded-2xl shadow-lg p-6 mb-4 flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-bold text-gray-800">体重記録</h1>
                                <div className="text-xs text-gray-400">v{APP_VERSION}</div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setShowCalendar(!showCalendar)} className="p-3 bg-green-100 rounded-xl"><Icon name="Calendar" className="text-green-700" /></button>
                                <button onClick={() => setShowSettings(!showSettings)} className="p-3 bg-gray-100 rounded-xl"><Icon name="Target" className="text-gray-700" /></button>
                                <button onClick={exportData} className="p-3 bg-purple-100 rounded-xl"><Icon name="Download" className="text-purple-700" /></button>
                            </div>
                        </div>

                        {showCalendar && (
                            <div className="bg-white rounded-2xl shadow-lg p-6 mb-4">
                                <div className="grid grid-cols-7 gap-1 text-center">
                                    {['日','月','火','水','木','金','土'].map(d => <div key={d} className="text-xs font-bold text-gray-400 py-2">{d}</div>)}
                                    {getCalendarData().map((day, i) => (
                                        <div key={i} className={`aspect-square flex flex-col items-center justify-center rounded-lg text-sm ${!day ? '' : day.isToday ? 'bg-indigo-100 border border-indigo-500' : day.record ? 'bg-green-100' : 'bg-gray-50'}`}>
                                            {day && <div>{day.date}</div>}
                                            {day?.record && <div className="text-[10px] font-bold text-green-600">{day.record.weight}</div>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {showSettings && (
                            <div className="bg-white rounded-2xl shadow-lg p-6 mb-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                                <input type="number" placeholder="身長 (cm)" value={height} onChange={e => setHeight(e.target.value)} className="p-3 border-2 rounded-xl" />
                                <input type="number" placeholder="目標体重 (kg)" value={goalWeight} onChange={e => setGoalWeight(e.target.value)} className="p-3 border-2 rounded-xl" />
                                <button onClick={saveSettings} className="col-span-full bg-indigo-600 text-white py-3 rounded-xl">設定を保存</button>
                            </div>
                        )}

                        <div className="bg-white rounded-2xl shadow-lg p-6 mb-4 grid grid-cols-1 md:grid-cols-5 gap-3">
                            <input type="date" value={date} onChange={e => setDate(e.target.value)} className="p-3 border-2 rounded-xl" />
                            <input type="time" value={time} onChange={e => setTime(e.target.value)} className="p-3 border-2 rounded-xl" />
                            <input type="number" placeholder="体重(kg)" value={weight} onChange={e => setWeight(e.target.value)} className="p-3 border-2 rounded-xl" />
                            <input type="text" placeholder="メモ" value={memo} onChange={e => setMemo(e.target.value)} className="p-3 border-2 rounded-xl" />
                            <button onClick={addRecord} className="bg-indigo-600 text-white rounded-xl flex items-center justify-center gap-2"><Icon name="Plus" />記録</button>
                        </div>

                        {stats && (
                            <div className="bg-white rounded-2xl shadow-lg p-6 mb-4">
                                {consecutiveDays > 0 && (
                                    <div className="mb-6 bg-orange-50 border-2 border-orange-200 p-4 rounded-xl flex items-center gap-4">
                                        <Icon name="Award" className="w-10 h-10 text-orange-600" />
                                        <div>
                                            <div className="text-sm text-orange-600 font-bold">連続記録</div>
                                            <div className="text-3xl font-bold text-orange-700">{consecutiveDays}日</div>
                                        </div>
                                    </div>
                                )}
                                
                                {progress !== null && (
                                    <div className="mb-6">
                                        <div className="flex justify-between mb-1 text-sm font-bold"><span>達成率</span><span>{progress.toFixed(1)}%</span></div>
                                        <div className="w-full bg-gray-200 h-4 rounded-full overflow-hidden">
                                            <div className="bg-indigo-500 h-full transition-all" style={{width: `${progress}%`}}></div>
                                        </div>
                                    </div>
                                )}

                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div className="bg-blue-50 p-4 rounded-xl">
                                        <div className="text-xs text-blue-600">現在</div>
                                        <div className="text-2xl font-bold">{stats.current.toFixed(1)}<span className="text-sm">kg</span></div>
                                    </div>
                                    <div className="bg-green-50 p-4 rounded-xl">
                                        <div className="text-xs text-green-600">BMI</div>
                                        <div className="text-2xl font-bold">{currentBMI || '--'}</div>
                                    </div>
                                    <div className="bg-purple-50 p-4 rounded-xl">
                                        <div className="text-xs text-purple-600">開始比</div>
                                        <div className={`text-2xl font-bold ${stats.change <= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                            {stats.change > 0 ? '+' : ''}{stats.change.toFixed(1)}kg
                                        </div>
                                    </div>
                                    <div className="bg-yellow-50 p-4 rounded-xl">
                                        <div className="text-xs text-yellow-600">目標まで</div>
                                        <div className="text-2xl font-bold">{goalDiff ? Math.abs(goalDiff).toFixed(1) : '--'}kg</div>
                                    </div>
                                </div>

                                <div className="h-64 mt-8">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <LineChart data={filteredRecords}>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#eee" />
                                            <XAxis dataKey="date" hide />
                                            <YAxis domain={['dataMin - 1', 'dataMax + 1']} hide />
                                            <Tooltip />
                                            <Line type="monotone" dataKey="weight" stroke="#4f46e5" strokeWidth={3} dot={{fill: '#4f46e5'}} />
                                            {goalWeight && <ReferenceLine y={parseFloat(goalWeight)} stroke="#ef4444" strokeDasharray="3 3" label="目標" />}
                                        </LineChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        )}

                        <div className="bg-white rounded-2xl shadow-lg p-6">
                            <h3 className="font-bold mb-4">履歴</h3>
                            <div className="space-y-3">
                                {[...records].reverse().map(r => (
                                    <div key={r.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                                        <div>
                                            <div className="text-xs text-gray-500">{r.date} {r.time}</div>
                                            <div className="font-bold">{r.weight}kg <span className="text-xs font-normal text-gray-400">{r.memo}</span></div>
                                        </div>
                                        <button onClick={() => setDeleteConfirm(r)} className="text-red-400 p-2"><Icon name="Trash2" /></button>
                                    </div>
                                ))}
