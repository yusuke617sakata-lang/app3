<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体重記録アプリ v1.0.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { 
            LineChart, Line, XAxis, YAxis, CartesianGrid, 
            Tooltip, ResponsiveContainer, ReferenceLine 
        } = Recharts;

        // アイコンを確実に表示するためのコンポーネント
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const [svg, setSvg] = useState('');
            useEffect(() => {
                // Lucideのアイコン名変換 (例: TrendingDown -> trending-down)
                const kebabName = name.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase();
                const iconData = lucide.icons[name] || lucide.icons[kebabName];
                
                if (iconData) {
                    const svgString = lucide.createSvg(iconData, {
                        class: className,
                        'stroke-width': 2
                    });
                    setSvg(svgString);
                }
            }, [name, className]);

            return <span dangerouslySetInnerHTML={{ __html: svg }} className="inline-flex items-center justify-center" />;
        };

        function WeightTracker() {
            const APP_VERSION = '1.0.1';
            
            // 状態管理
            const [records, setRecords] = useState([]);
            const [weight, setWeight] = useState('');
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [time, setTime] = useState(new Date().toTimeString().slice(0, 5));
            const [memo, setMemo] = useState('');
            const [goalWeight, setGoalWeight] = useState('');
            const [height, setHeight] = useState('');
            const [showSettings, setShowSettings] = useState(false);
            const [period, setPeriod] = useState('all');
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const [showCalendar, setShowCalendar] = useState(false);
            const [showUpdateNotice, setShowUpdateNotice] = useState(false);

            // 初期読み込み
            useEffect(() => {
                try {
                    const saved = localStorage.getItem('weightRecords');
                    const savedGoal = localStorage.getItem('goalWeight');
                    const savedHeight = localStorage.getItem('height');
                    const savedVersion = localStorage.getItem('appVersion');
                    
                    if (saved) setRecords(JSON.parse(saved));
                    if (savedGoal) setGoalWeight(savedGoal);
                    if (savedHeight) setHeight(savedHeight);
                    
                    if (savedVersion !== APP_VERSION) {
                        setShowUpdateNotice(true);
                        localStorage.setItem('appVersion', APP_VERSION);
                    }
                } catch (e) {
                    console.error("Failed to load from localStorage", e);
                }
            }, []);

            // データ保存
            useEffect(() => {
                if (records.length > 0) {
                    localStorage.setItem('weightRecords', JSON.stringify(records));
                }
            }, [records]);

            const saveSettings = () => {
                localStorage.setItem('goalWeight', goalWeight);
                localStorage.setItem('height', height);
                setShowSettings(false);
            };

            const addRecord = () => {
                if (!weight || !date || !time) return;
                const newRecord = {
                    date,
                    time,
                    datetime: `${date} ${time}`,
                    weight: parseFloat(weight),
                    memo: memo || '',
                    id: Date.now()
                };
                const updated = [...records, newRecord].sort((a, b) => new Date(a.datetime) - new Date(b.datetime));
                setRecords(updated);
                setWeight('');
                setMemo('');
            };

            const confirmDelete = () => {
                if (deleteConfirm) {
                    setRecords(records.filter(r => r.id !== deleteConfirm.id));
                    setDeleteConfirm(null);
                }
            };

            const exportData = () => {
                const csv = ['日付,時刻,体重(kg),BMI,メモ'];
                records.forEach(r => {
                    const bmi = height ? (r.weight / Math.pow(parseFloat(height) / 100, 2)).toFixed(1) : '';
                    csv.push(`${r.date},${r.time},${r.weight},${bmi},${r.memo}`);
                });
                const blob = new Blob([csv.join('\n')], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `体重記録_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
            };

            // 統計計算
            const stats = useMemo(() => {
                if (records.length === 0) return null;
                const current = records[records.length - 1].weight;
                const start = records[0].weight;
                return {
                    current,
                    start,
                    change: current - start,
                    bmi: height ? (current / Math.pow(parseFloat(height) / 100, 2)).toFixed(1) : null,
                    goalDiff: goalWeight ? (current - parseFloat(goalWeight)) : null
                };
            }, [records, height, goalWeight]);

            const progress = useMemo(() => {
                if (!stats || !goalWeight || stats.start === parseFloat(goalWeight)) return null;
                const totalTarget = stats.start - parseFloat(goalWeight);
                const currentProgress = stats.start - stats.current;
                return Math.min(100, Math.max(0, (currentProgress / totalTarget) * 100));
            }, [stats, goalWeight]);

            const getCalendarData = () => {
                const today = new Date();
                const firstDay = new Date(today.getFullYear(), today.getMonth(), 1).getDay();
                const lastDate = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
                const days = [];
                for (let i = 0; i < firstDay; i++) days.push(null);
                for (let d = 1; d <= lastDate; d++) {
                    const dStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    days.push({ date: d, record: records.find(r => r.date === dStr), isToday: dStr === new Date().toISOString().split('T')[0] });
                }
                return days;
            };

            return (
                <div className="p-4 max-w-5xl mx-auto space-y-4">
                    {/* アップデート通知 */}
                    {showUpdateNotice && (
                        <div className="bg-green-500 text-white p-4 rounded-xl shadow-lg flex justify-between items-center animate-bounce">
                            <span>✨ アップデート完了！ v{APP_VERSION}</span>
                            <button onClick={() => setShowUpdateNotice(false)}>×</button>
                        </div>
                    )}

                    {/* 削除確認 */}
                    {deleteConfirm && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full">
                                <h3 className="text-xl font-bold mb-4">記録を削除しますか？</h3>
                                <div className="bg-gray-50 p-4 rounded-xl mb-6">
                                    {deleteConfirm.date} - {deleteConfirm.weight}kg
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setDeleteConfirm(null)} className="flex-1 py-3 bg-gray-200 rounded-xl">キャンセル</button>
                                    <button onClick={confirmDelete} className="flex-1 py-3 bg-red-600 text-white rounded-xl">削除</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ヘッダー */}
                    <header className="bg-white rounded-2xl shadow-lg p-6 flex justify-between items-center">
                        <div>
                            <h1 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
                                <Icon name="Scale" className="text-indigo-600 w-7 h-7" /> 体重記録
                            </h1>
                            <p className="text-xs text-gray-400">Personal Weight Tracker v{APP_VERSION}</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setShowCalendar(!showCalendar)} className="p-3 bg-green-100 rounded-xl hover:bg-green-200 transition">
                                <Icon name="Calendar" className="text-green-700" />
                            </button>
                            <button onClick={() => setShowSettings(!showSettings)} className="p-3 bg-gray-100 rounded-xl hover:bg-gray-200 transition">
                                <Icon name="Target" className="text-gray-700" />
                            </button>
                            <button onClick={exportData} className="p-3 bg-purple-100 rounded-xl hover:bg-purple-200 transition">
                                <Icon name="Download" className="text-purple-700" />
                            </button>
                        </div>
                    </header>

                    {/* 設定 */}
                    {showSettings && (
                        <section className="bg-white rounded-2xl shadow-lg p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-bold mb-1">身長 (cm)</label>
                                <input type="number" value={height} onChange={e => setHeight(e.target.value)} className="w-full p-3 border-2 rounded-xl" placeholder="170" />
                            </div>
                            <div>
                                <label className="block text-sm font-bold mb-1">目標体重 (kg)</label>
                                <input type="number" value={goalWeight} onChange={e => setGoalWeight(e.target.value)} className="w-full p-3 border-2 rounded-xl" placeholder="60" />
                            </div>
                            <button onClick={saveSettings} className="md:col-span-2 bg-indigo-600 text-white py-3 rounded-xl font-bold">設定を保存</button>
                        </section> section>
                    )}

                    {/* カレンダー */}
                    {showCalendar && (
                        <section className="bg-white rounded-2xl shadow-lg p-6">
                            <div className="grid grid-cols-7 gap-1 text-center text-xs mb-2">
                                {['日','月','火','水','木','金','土'].map(d => <div key={d} className="font-bold text-gray-400">{d}</div>)}
                            </div>
                            <div className="grid grid-cols-7 gap-1">
                                {getCalendarData().map((day, i) => (
                                    <div key={i} className={`aspect-square flex flex-col items-center justify-center rounded-lg ${!day ? '' : day.isToday ? 'bg-indigo-100 border border-indigo-500' : day.record ? 'bg-green-100' : 'bg-gray-50'}`}>
                                        {day && <span className="text-xs">{day.date}</span>}
                                        {day?.record && <span className="text-[10px] font-bold text-green-600">{day.record.weight}</span>}
                                    </div>
                                ))}
                            </div>
                        </section>
                    )}

                    {/* 入力フォーム */}
                    <section className="bg-white rounded-2xl shadow-lg p-6 grid grid-cols-1 md:grid-cols-5 gap-3">
                        <input type="date" value={date} onChange={e => setDate(e.target.value)} className="p-3 border-2 rounded-xl" />
                        <input type="time" value={time} onChange={e => setTime(e.target.value)} className="p-3 border-2 rounded-xl" />
                        <input type="number" step="0.1" placeholder="体重(kg)" value={weight} onChange={e => setWeight(e.target.value)} className="p-3 border-2 rounded-xl font-bold" />
                        <input type="text" placeholder="メモ" value={memo} onChange={e => setMemo(e.target.value)} className="p-3 border-2 rounded-xl" />
                        <button onClick={addRecord} className="bg-indigo-600 text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-indigo-700">
                            <Icon name="Plus" /> 記録する
                        </button>
                    </section>

                    {/* 統計 & グラフ */}
                    {stats && (
                        <section className="bg-white rounded-2xl shadow-lg p-6">
                            {progress !== null && (
                                <div className="mb-6">
                                    <div className="flex justify-between text-sm font-bold mb-2"><span>目標達成率</span><span>{progress.toFixed(1)}%</span></div>
                                    <div className="w-full bg-gray-100 h-4 rounded-full overflow-hidden">
                                        <div className="bg-indigo-500 h-full transition-all duration-1000" style={{width: `${progress}%`}}></div>
                                    </div>
                                </div>
                            )}
                            
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                                <div className="p-4 bg-blue-50 rounded-2xl">
                                    <div className="text-xs text-blue-600 font-bold">現在の体重</div>
                                    <div className="text-2xl font-black">{stats.current}kg</div>
                                </div>
                                <div className="p-4 bg-green-50 rounded-2xl">
                                    <div className="text-xs text-green-600 font-bold">BMI</div>
                                    <div className="text-2xl font-black">{stats.bmi || '--'}</div>
                                </div>
                                <div className="p-4 bg-purple-50 rounded-2xl">
                                    <div className="text-xs text-purple-600 font-bold">開始比</div>
                                    <div className={`text-2xl font-black ${stats.change <= 0 ? 'text-green-600' : 'text-red-500'}`}>
                                        {stats.change > 0 ? '+' : ''}{stats.change.toFixed(1)}kg
                                    </div>
                                </div>
                                <div className="p-4 bg-orange-50 rounded-2xl">
                                    <div className="text-xs text-orange-600 font-bold">目標まで</div>
                                    <div className="text-2xl font-black">{stats.goalDiff ? Math.abs(stats.goalDiff).toFixed(1) : '--'}kg</div>
                                </div>
                            </div>

                            <div className="h-64 w-full">
                                <ResponsiveContainer width="100%" height="100%">
                                    <LineChart data={records}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f0f0f0" />
                                        <XAxis dataKey="date" hide />
                                        <YAxis domain={['dataMin - 1', 'dataMax + 1']} hide />
                                        <Tooltip contentStyle={{borderRadius: '12px', border: 'none', boxShadow: '0 4px 12px rgba(0,0,0,0.1)'}} />
                                        <Line type="monotone" dataKey="weight" stroke="#4f46e5" strokeWidth={4} dot={{r: 4, fill: '#4f46e5'}} activeDot={{r: 8}} />
                                        {goalWeight && <ReferenceLine y={parseFloat(goalWeight)} stroke="#f43f5e" strokeDasharray="5 5" label={{value: '目標', position: 'right', fill: '#f43f5e', fontSize: 12}} />}
                                    </LineChart>
                                </ResponsiveContainer>
                            </div>
                        </section>
                     section>)}

                    {/* 履歴リスト */}
                    <section className="bg-white rounded-2xl shadow-lg p-6">
                        <h3 className="font-bold text-gray-800 mb-4 flex items-center gap-2">
                            <Icon name="TrendingDown" className="text-indigo-500" /> 履歴一覧
                        </h3>
                        <div className="space-y-2 max-h-96 overflow-y-auto pr-2">
                            {[...records].reverse().map(r => (
                                <div key={r.id} className="flex items-center justify-between p-4 bg-gray-50 rounded-xl hover:bg-gray-100 transition">
                                    <div>
                                        <div className="text-xs text-gray-400 font-medium">{r.date} {r.time}</div>
                                        <div className="font-bold text-gray-700">{r.weight.toFixed(1)}kg <span className="ml-2 font-normal text-sm text-gray-500">{r.memo}</span></div>
                                    </div>
                                    <button onClick={() => setDeleteConfirm(r)} className="p-2 text-gray-300 hover:text-red-500 transition">
                                        <Icon name="Trash2" className="w-5 h-5" />
                                    </button>
                                </div>
                            ))}
                            {records.length === 0 && <div className="text-center py-10 text-gray-400">記録がありません</div>}
                        </div>
                    </section>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WeightTracker />);
    </script>
</body>
</html>
