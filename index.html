<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>体重記録アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/recharts@2.5.0/dist/Recharts.js"></script>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine } = Recharts;

    const APP_VERSION = '1.0.1';

    const Icon = ({ d, className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d={d} />
      </svg>
    );

    function WeightTracker() {
      const [records, setRecords] = useState([]);
      const [weight, setWeight] = useState('');
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [time, setTime] = useState(new Date().toTimeString().slice(0, 5));
      const [memo, setMemo] = useState('');
      const [goalWeight, setGoalWeight] = useState('');
      const [height, setHeight] = useState('');
      const [showSettings, setShowSettings] = useState(false);
      const [period, setPeriod] = useState('all');
      const [deleteConfirm, setDeleteConfirm] = useState(null);
      const [showCalendar, setShowCalendar] = useState(false);
      const [showUpdateNotice, setShowUpdateNotice] = useState(false);

      useEffect(() => {
        const saved = localStorage.getItem('weightRecords');
        const savedGoal = localStorage.getItem('goalWeight');
        const savedHeight = localStorage.getItem('height');
        const savedVersion = localStorage.getItem('appVersion');
        
        if (saved) setRecords(JSON.parse(saved));
        if (savedGoal) setGoalWeight(savedGoal);
        if (savedHeight) setHeight(savedHeight);
        
        if (savedVersion !== APP_VERSION) {
          setShowUpdateNotice(true);
          localStorage.setItem('appVersion', APP_VERSION);
          setTimeout(() => setShowUpdateNotice(false), 5000);
        }
      }, []);

      useEffect(() => {
        if (records.length > 0) {
          localStorage.setItem('weightRecords', JSON.stringify(records));
        }
      }, [records]);

      const saveSettings = () => {
        if (goalWeight) localStorage.setItem('goalWeight', goalWeight);
        if (height) localStorage.setItem('height', height);
        setShowSettings(false);
      };

      const addRecord = () => {
        if (!weight || !date || !time) return;
        const newRecord = {
          date, time,
          datetime: `${date} ${time}`,
          weight: parseFloat(weight),
          memo: memo || '',
          id: Date.now()
        };
        const updated = [...records, newRecord].sort((a, b) => new Date(a.datetime) - new Date(b.datetime));
        setRecords(updated);
        setWeight('');
        setMemo('');
        setDate(new Date().toISOString().split('T')[0]);
        setTime(new Date().toTimeString().slice(0, 5));
      };

      const deleteRecord = (id) => setDeleteConfirm(records.find(r => r.id === id));
      
      const confirmDelete = () => {
        if (deleteConfirm) {
          setRecords(records.filter(r => r.id !== deleteConfirm.id));
          setDeleteConfirm(null);
        }
      };

      const exportData = () => {
        const csv = ['日付,時刻,体重(kg),BMI,メモ'];
        records.forEach(r => {
          const bmi = height ? (r.weight / Math.pow(parseFloat(height) / 100, 2)).toFixed(1) : '';
          csv.push(`${r.date},${r.time},${r.weight},${bmi},${r.memo}`);
        });
        const blob = new Blob([csv.join('\\n')], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `体重記録_${new Date().toISOString().split('T')[0]}.csv`;
        link.click();
      };

      const getFilteredRecords = () => {
        if (period === 'all') return records;
        const now = new Date();
        const cutoff = new Date();
        if (period === 'week') cutoff.setDate(now.getDate() - 7);
        else if (period === 'month') cutoff.setMonth(now.getMonth() - 1);
        else if (period === 'three-months') cutoff.setMonth(now.getMonth() - 3);
        return records.filter(r => new Date(r.datetime) >= cutoff);
      };

      const calculateAverage = (data, days) => {
        if (data.length === 0) return null;
        const cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - days);
        const recent = data.filter(r => new Date(r.datetime) >= cutoff);
        return recent.length > 0 ? recent.reduce((sum, r) => sum + r.weight, 0) / recent.length : null;
      };

      const getConsecutiveDays = () => {
        if (records.length === 0) return 0;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const recordDates = new Set(records.map(r => r.date));
        let consecutive = 0;
        let checkDate = new Date(today);
        while (recordDates.has(checkDate.toISOString().split('T')[0])) {
          consecutive++;
          checkDate.setDate(checkDate.getDate() - 1);
        }
        return consecutive;
      };

      const getCalendarData = () => {
        const today = new Date();
        const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
        const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);
        const recordsByDate = {};
        records.forEach(r => {
          if (!recordsByDate[r.date] || new Date(r.datetime) > new Date(recordsByDate[r.date].datetime)) {
            recordsByDate[r.date] = r;
          }
        });
        const days = [];
        for (let i = 0; i < firstDay.getDay(); i++) days.push(null);
        for (let date = 1; date <= lastDay.getDate(); date++) {
          const dateObj = new Date(today.getFullYear(), today.getMonth(), date);
          const dateStr = dateObj.toISOString().split('T')[0];
          days.push({
            date, dateStr,
            record: recordsByDate[dateStr] || null,
            isToday: dateStr === today.toISOString().split('T')[0]
          });
        }
        return days;
      };

      const filteredRecords = getFilteredRecords();
      const consecutiveDays = getConsecutiveDays();
      const calendarData = getCalendarData();
      
      const stats = filteredRecords.length > 0 ? {
        current: filteredRecords[filteredRecords.length - 1].weight,
        start: filteredRecords[0].weight,
        change: filteredRecords[filteredRecords.length - 1].weight - filteredRecords[0].weight,
        weekAvg: calculateAverage(filteredRecords, 7),
        monthAvg: calculateAverage(filteredRecords, 30)
      } : null;

      const currentBMI = stats && height ? (stats.current / Math.pow(parseFloat(height) / 100, 2)).toFixed(1) : null;
      const goalDiff = stats && goalWeight ? (stats.current - parseFloat(goalWeight)) : null;
      const progress = stats && goalWeight && stats.start !== parseFloat(goalWeight) 
        ? Math.min(100, Math.max(0, ((stats.start - stats.current) / (stats.start - parseFloat(goalWeight))) * 100)) : null;

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
          <div className="max-w-5xl mx-auto">
            {showUpdateNotice && (
              <div className="fixed top-4 right-4 bg-green-500 text-white px-6 py-4 rounded-xl shadow-2xl z-50">
                <div className="flex items-center gap-3">
                  <div className="text-2xl">✨</div>
                  <div>
                    <div className="font-bold">アップデート完了！</div>
                    <div className="text-sm">v{APP_VERSION}が適用されました</div>
                  </div>
                  <button onClick={() => setShowUpdateNotice(false)} className="ml-4 text-white hover:text-gray-200 text-xl">×</button>
                </div>
              </div>
            )}

            {deleteConfirm && (
              <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl">
                  <h3 className="text-xl font-bold text-gray-800 mb-4">記録を削除しますか？</h3>
                  <div className="bg-gray-50 p-4 rounded-xl mb-6">
                    <div className="text-sm text-gray-600 mb-1">{deleteConfirm.date} {deleteConfirm.time}</div>
                    <div className="text-2xl font-bold text-indigo-600">{deleteConfirm.weight.toFixed(1)} kg</div>
                    {deleteConfirm.memo && <div className="text-sm text-gray-600 mt-2">📝 {deleteConfirm.memo}</div>}
                  </div>
                  <div className="flex gap-3">
                    <button onClick={() => setDeleteConfirm(null)} className="flex-1 px-6 py-3 bg-gray-200 text-gray-700 rounded-xl font-semibold hover:bg-gray-300 transition">キャンセル</button>
                    <button onClick={confirmDelete} className="flex-1 px-6 py-3 bg-red-600 text-white rounded-xl font-semibold hover:bg-red-700 transition">削除</button>
                  </div>
                </div>
              </div>
            )}

            <div className="bg-white rounded-2xl shadow-lg p-6 mb-4">
              <div className="flex items-center justify-between">
                <div>
                  <h1 className="text-2xl font-bold text-gray-800">体重記録</h1>
                  <div className="text-xs text-gray-400 mt-1">v{APP_VERSION}</div>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => setShowCalendar(!showCalendar)} className="p-3 bg-green-100 rounded-xl hover:bg-green-200 transition">
                    <Icon d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                  </button>
                  <button onClick={() => setShowSettings(!showSettings)} className="p-3 bg-gray-100 rounded-xl hover:bg-gray-200 transition">
                    <Icon d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </button>
                  {records.length > 0 && (
                    <button onClick={exportData} className="p-3 bg-purple-100 rounded-xl hover:bg-purple-200 transition">
                      <Icon d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </button>
                  )}
                </div>
              </div>
            </div>

            {showCalendar && (
              <div className="bg-white rounded-2xl shadow-lg p-6 mb-4">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-lg font-bold text-gray-800">{new Date().getFullYear()}年 {new Date().getMonth() + 1}月</h3>
                  {consecutiveDays > 0 && (
                    <div className="flex items-center gap-2 bg-gradient-to-r from-orange-100 to-yellow-100 px-4 py-2 rounded-full">
                      <Icon d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
                      <span className="font-bold text-orange-700">{consecutiveDays}日連続記録中！</span>
                    </div>
                  )}
                </div>
                <div className="grid grid-cols-7 gap-2">
                  {['日', '月', '火', '水', '木', '金', '土'].map(day => (
                    <div key={day} className="text-center text-sm font-bold text-gray-500 py-2">{day}</div>
                  ))}
                  {calendarData.map((day, i) => (
                    <div key={i} className={`aspect-square flex flex-col items-center justify-center rounded-lg text-sm ${
                      !day ? 'bg-transparent' : day.isToday ? 'bg-indigo-100 border-2 border-indigo-500' : day.record ? 'bg-green-100' : 'bg-gray-50'
                    }`}>
                      {day && (
                        <>
                          <div className={`font-semibold ${day.isToday ? 'text-indigo-700' : day.record ? 'text-green-700' : 'text-gray-600'}`}>{day.date}</div>
                          {day.record && <div className="text-xs font-bold text-green-600 mt-1">{day.record.weight.toFixed(1)}</div>}
                        </>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {showSettings && (
              <div className="bg-white rounded-2xl shadow-lg p-6 mb-4">
                <h3 className="text-lg font-bold text-gray-800 mb-4">設定</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">身長 (cm)</label>
                    <input type="number" step="0.1" value={height} onChange={(e) => setHeight(e.target.value)} placeholder="例: 170" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:outline-none" />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">目標体重 (kg)</label>
                    <input type="number" step="0.1" value={goalWeight} onChange={(e) => setGoalWeight(e.target.value)} placeholder="例: 65" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:outline-none" />
                  </div>
                </div>
                <button onClick={saveSettings} className="w-full mt-4 bg-indigo-600 text-white py-3 rounded-xl font-semibold hover:bg-indigo-700 transition">保存</button>
              </div>
            )}

            <div className="bg-white rounded-2xl shadow-lg p-6 mb-4">
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-3">
                <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:outline-none text-center font-semibold" />
                <input type="time" value={time} onChange={(e) => setTime(e.target.value)} className="px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:outline-none text-center font-semibold" />
                <input type="number" step="0.1" value={weight} onChange={(e) => setWeight(e.target.value)} placeholder="体重 (kg)" className="px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:outline-none" />
                <input type="text" value={memo} onChange={(e) => setMemo(e.target.value)} placeholder="メモ (任意)" className="px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:outline-none" />
                <button onClick={addRecord} className="bg-indigo-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-indigo-700 transition flex items-center justify-center gap-2">
                  <Icon d="M12 4v16m8-8H4" />記録
                </button>
              </div>
            </div>

            {stats && (
              <div className="bg-white rounded-2xl shadow-lg p-6 mb-4">
                {consecutiveDays > 0 && !showCalendar && (
                  <div className="mb-6 bg-gradient-to-r from-orange-50 to-yellow-50 p-4 rounded-xl border-2 border-orange-200">
                    <div className="flex items-center justify-center gap-3">
                      <Icon d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" className="w-8 h-8" />
                      <div>
                        <div className="text-sm text-orange-600 font-semibold">連続記録</div>
                        <div className="text-3xl font-bold text-orange-700">{consecutiveDays}日</div>
                      </div>
                      <div className="text-orange-600 text-sm">素晴らしい！<br />この調子で続けましょう！</div>
                    </div>
                  </div>
                )}

                {progress !== null && (
                  <div className="mb-6">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-sm font-semibold text-gray-700">目標達成率</span>
                      <span className="text-2xl font-bold text-indigo-600">{progress.toFixed(1)}%</span>
                    </div>
                    <div className="w-full bg-gray-200 rounded-full h-6 overflow-hidden">
                      <div className="bg-gradient-to-r from-indigo-500 to-purple-500 h-full transition-all duration-500" style={{width: `${progress}%`}} />
                    </div>
                    <div className="flex justify-between text-xs text-gray-500 mt-2">
                      <span>{stats.start.toFixed(1)}kg</span>
                      <span className="font-semibold text-indigo-600">あと {Math.abs(goalDiff).toFixed(1)}kg</span>
                      <span>{goalWeight}kg</span>
                    </div>
                  </div>
                )}

                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
                  <div className="bg-gradient-to-br from-indigo-50 to-indigo-100 p-4 rounded-xl">
                    <div className="text-xs font-semibold text-indigo-600 mb-1">現在の体重</div>
                    <div className="text-2xl font-bold text-indigo-700">{stats.current.toFixed(1)}<span className="text-sm ml-1">kg</span></div>
                  </div>
                  {currentBMI && (
                    <div className="bg-gradient-to-br from-teal-50 to-teal-100 p-4 rounded-xl">
                      <div className="text-xs font-semibold text-teal-600 mb-1">BMI</div>
                      <div className="text-2xl font-bold text-teal-700">{currentBMI}</div>
                    </div>
                  )}
                  <div className={`bg-gradient-to-br p-4 rounded-xl ${stats.change <= 0 ? 'from-green-50 to-green-100' : 'from-orange-50 to-orange-100'}`}>
                    <div className={`text-xs font-semibold mb-1 ${stats.change <= 0 ? 'text-green-600' : 'text-orange-600'}`}>変化量</div>
                    <div className={`text-2xl font-bold ${stats.change <= 0 ? 'text-green-700' : 'text-orange-700'}`}>
                      {stats.change > 0 ? '+' : ''}{stats.change.toFixed(1)}<span className="text-sm ml-1">kg</span>
                    </div>
                  </div>
                  {stats.weekAvg && (
                    <div className="bg-gradient-to-br from-blue-50 to-blue-100 p-4 rounded-xl">
                      <div className="text-xs font-semibold text-blue-600 mb-1">週平均</div>
                      <div className="text-2xl font-bold text-blue-700">{stats.weekAvg.toFixed(1)}<span className="text-sm ml-1">kg</span></div>
                    </div>
                  )}
                  {stats.monthAvg && (
                    <div className="bg-gradient-to-br from-cyan-50 to-cyan-100 p-4 rounded-xl">
                      <div className="text-xs font-semibold text-cyan-600 mb-1">月平均</div>
                      <div className="text-2xl font-bold text-cyan-700">{stats.monthAvg.toFixed(1)}<span className="text-sm ml-1">kg</span></div>
                    </div>
                  )}
                  {goalWeight && (
                    <div className="bg-gradient-to-br from-purple-50 to-purple-100 p-4 rounded-xl">
                      <div className="text-xs font-semibold text-purple-600 mb-1">目標体重</div>
                      <div className="text-2xl font-bold text-purple-700">{parseFloat(goalWeight).toFixed(1)}<span className="text-sm ml-1">kg</span></div>
                    </div>
                  )}
                  {goalDiff !== null && (
                    <div className={`bg-gradient-to-br p-4 rounded-xl ${goalDiff <= 0 ? 'from-green-50 to-green-100' : 'from-red-50 to-red-100'}`}>
                      <div className={`text-xs font-semibold mb-1 ${goalDiff <= 0 ? 'text-green-600' : 'text-red-600'}`}>目標まで</div>
                      <div className={`text-2xl font-bold ${goalDiff <= 0 ? 'text-green-700' : 'text-red-700'}`}>
                        {goalDiff > 0 ? '-' : '+'}{Math.abs(goalDiff).toFixed(1)}<span className="text-sm ml-1">kg</span>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {records.length > 0 && (
              <>
                <div className="bg-white rounded-2xl shadow-lg p-6 mb-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <h2 className="text-xl font-bold text-gray-800">体重推移</h2>
                    <div className="flex gap-2">
                      {['week', 'month', 'three-months', 'all'].map((p) => (
                        <button key={p} onClick={() => setPeriod(p)} className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${
                          period === p ? 'bg-indigo-600 text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                        }`}>
                          {p === 'week' ? '1週間' : p === 'month' ? '1ヶ月' : p === 'three-months' ? '3ヶ月' : '全期間'}
                        </button>
                      ))}
                    </div>
                  </div>
                  <ResponsiveContainer width="100%" height={320}>
                    <LineChart data={filteredRecords}>
                      <CartesianGrid strokeDasharray="3 3" stroke="#e5e7eb" />
                      <XAxis dataKey="date" tick={{fontSize: 11, fill: '#6b7280'}} angle={-45} textAnchor="end" height={70} />
                      <YAxis domain={[(dataMin) => Math.floor(Math.min(dataMin, goalWeight ? parseFloat(goalWeight) : dataMin) - 3), (dataMax) => Math.ceil(Math.max(dataMax, goalWeight ? parseFloat(goalWeight) : dataMax) + 3)]} tick={{fontSize: 11, fill: '#6b7280'}} />
                      <Tooltip contentStyle={{backgroundColor: 'white', border: '2px solid #e5e7eb', borderRadius: '12px', padding: '12px'}}
                        formatter={(value) => [`${value.toFixed(1)} kg`, '体重']}
                        labelFormatter={(label, payload) => {
                          if (payload && payload[0]) {
                            const p = payload[0].payload;
                            return `${p.date} ${p.time}${p.memo ? ` - ${p.memo}` : ''}`;
                          }
                          return label;
                        }}
                      />
                      {goalWeight && (
                        <ReferenceLine y={parseFloat(goalWeight)} stroke="#9333ea" strokeDasharray="5 5" strokeWidth={3}
                          label={{ value: `目標: ${goalWeight}kg`, position: 'top', fill: '#9333ea', fontSize: 14, fontWeight: 'bold', offset: 10 }}
                        />
                      )}
                      <Line type="monotone" dataKey="weight" stroke="#4f46e5" strokeWidth={3}
                        dot={{ fill: '#4f46e5', r: 4, strokeWidth: 2, stroke: 'white' }}
                        activeDot={{ r: 6, strokeWidth: 2 }}
                      />
                    </LineChart>
                  </ResponsiveContainer>
                </div>

                <div className="bg-white rounded-2xl shadow-lg p-6">
                  <h2 className="text-xl font-bold text-gray-800 mb-4">記録一覧</h2>
                  <div className="space-y-3 max-h-96 overflow-y-auto">
                    {[...records].reverse().map(record => {
                      const bmi = height ? (record.weight / Math.pow(parseFloat(height) / 100, 2)).toFixed(1) : null;
                      return (
                        <div key={record.id} className="flex items-start justify-between p-4 bg-gradient-to-r from-gray-50 to-white rounded-xl hover:shadow-md transition border border-gray-100">
                          <div className="flex-1">
                            <div className="flex items-center gap-3 mb-2">
                              <span className="text-sm font-semibold text-gray-500">{record.date}</span>
                              <span className="text-sm font-semibold text-gray-500">{record.time}</span>
                            </div>
                            <div className="flex items-center gap-4">
                              <span className="text-3xl font-bold text-indigo-600">{record.weight.toFixed(1)}<span className="text-lg ml-1">kg</span></span>
                              {bmi && (
                                <span className="px-3 py-1 bg-teal-100 text-teal-700 rounded-full text-sm font-bold">BMI {bmi}</span>
                              )}
                            </div>
                            {record.memo && (
                              <div className="mt-2 text-sm text-gray-600 bg-blue-50 px-3 py-1 rounded-lg inline-block">📝 {record.memo}</div>
                            )}
                          </div>
                          <button onClick={() => deleteRecord(record.id)} className="p-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition">
                            <Icon d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </>
            )}

            {records.length === 0 && (
              <div className="bg-white rounded-2xl shadow-lg p-16 text-center">
                <div className="bg-indigo-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                  <Icon d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" className="w-10 h-10" />
                </div>
                <p className="text-xl font-bold text-gray-800 mb-2">まだ記録がありません</p>
                <p className="text-gray-500">上のフォームから体重を記録してみましょう！</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WeightTracker />);
  </script>
</body>
</html>
