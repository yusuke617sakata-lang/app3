<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体重記録アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-indigo-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine } = Recharts;

        // アイコンコンポーネント
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const [svg, setSvg] = useState('');
            useEffect(() => {
                if (window.lucide) {
                    const iconData = lucide.icons[name];
                    if (iconData) {
                        const svgString = lucide.createSvg(iconData, {
                            class: className,
                            'stroke-width': 2
                        });
                        setSvg(svgString);
                    }
                }
            }, [name, className]);
            return <span dangerouslySetInnerHTML={{ __html: svg }} className="inline-flex" />;
        };

        function WeightTracker() {
            const [records, setRecords] = useState([]);
            const [weight, setWeight] = useState('');
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [time, setTime] = useState(new Date().toTimeString().slice(0, 5));
            const [memo, setMemo] = useState('');
            const [goalWeight, setGoalWeight] = useState('');
            const [height, setHeight] = useState('');
            const [showSettings, setShowSettings] = useState(false);
            const [showCalendar, setShowCalendar] = useState(false);
            const [deleteConfirm, setDeleteConfirm] = useState(null);

            // データ読み込み
            useEffect(() => {
                const saved = localStorage.getItem('weightRecords');
                if (saved) setRecords(JSON.parse(saved));
                setGoalWeight(localStorage.getItem('goalWeight') || '');
                setHeight(localStorage.getItem('height') || '');
            }, []);

            // データ保存
            useEffect(() => {
                localStorage.setItem('weightRecords', JSON.stringify(records));
            }, [records]);

            const addRecord = () => {
                if (!weight) return;
                const newRecord = {
                    date, time, weight: parseFloat(weight), memo, id: Date.now(),
                    datetime: `${date} ${time}`
                };
                const updated = [...records, newRecord].sort((a, b) => new Date(a.datetime) - new Date(b.datetime));
                setRecords(updated);
                setWeight('');
                setMemo('');
            };

            const deleteRecord = () => {
                setRecords(records.filter(r => r.id !== deleteConfirm.id));
                setDeleteConfirm(null);
            };

            const stats = useMemo(() => {
                if (records.length === 0) return null;
                const current = records[records.length - 1].weight;
                const start = records[0].weight;
                const bmi = height ? (current / Math.pow(parseFloat(height) / 100, 2)).toFixed(1) : null;
                return { current, change: current - start, bmi };
            }, [records, height]);

            return (
                <div className="max-w-4xl mx-auto p-4 space-y-4 text-slate-800">
                    {/* 削除確認 */}
                    {deleteConfirm && (
                        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl">
                                <h3 className="text-xl font-bold mb-4">削除しますか？</h3>
                                <p className="text-slate-500 mb-6">{deleteConfirm.date} の記録を消去します。</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setDeleteConfirm(null)} className="flex-1 py-3 bg-slate-100 rounded-2xl font-semibold">やめる</button>
                                    <button onClick={deleteRecord} className="flex-1 py-3 bg-red-500 text-white rounded-2xl font-semibold">削除</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ヘッダー */}
                    <div className="bg-white/80 backdrop-blur-md rounded-3xl p-6 shadow-sm border border-white flex justify-between items-center">
                        <div>
                            <h1 className="text-2xl font-extrabold text-indigo-900 tracking-tight">体重記録</h1>
                            <p className="text-xs font-medium text-slate-400 uppercase tracking-widest">v1.0.1 Stable</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setShowCalendar(!showCalendar)} className="p-3 bg-indigo-50 rounded-2xl text-indigo-600 hover:scale-105 transition"><Icon name="Calendar" /></button>
                            <button onClick={() => setShowSettings(!showSettings)} className="p-3 bg-slate-50 rounded-2xl text-slate-600 hover:scale-105 transition"><Icon name="Settings" /></button>
                        </div>
                    </div>

                    {/* 設定パネル */}
                    {showSettings && (
                        <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 animate-in fade-in duration-300">
                            <h2 className="font-bold mb-4">目標設定</h2>
                            <div className="grid grid-cols-2 gap-4">
                                <input type="number" placeholder="身長(cm)" value={height} onChange={e => {setHeight(e.target.value); localStorage.setItem('height', e.target.value)}} className="p-4 bg-slate-50 rounded-2xl border-none focus:ring-2 focus:ring-indigo-500" />
                                <input type="number" placeholder="目標(kg)" value={goalWeight} onChange={e => {setGoalWeight(e.target.value); localStorage.setItem('goalWeight', e.target.value)}} className="p-4 bg-slate-50 rounded-2xl border-none focus:ring-2 focus:ring-indigo-500" />
                            </div>
                        </div>
                    )}

                    {/* 入力エリア */}
                    <div className="bg-white rounded-3xl p-6 shadow-md border border-slate-100 grid grid-cols-1 md:grid-cols-4 gap-3">
                        <input type="date" value={date} onChange={e => setDate(e.target.value)} className="p-4 bg-slate-50 rounded-2xl border-none font-semibold text-slate-600 focus:ring-2 focus:ring-indigo-200" />
                        <input type="number" step="0.1" placeholder="体重 (kg)" value={weight} onChange={e => setWeight(e.target.value)} className="p-4 bg-slate-50 rounded-2xl border-none font-bold text-lg focus:ring-2 focus:ring-indigo-200" />
                        <input type="text" placeholder="一言メモ" value={memo} onChange={e => setMemo(e.target.value)} className="p-4 bg-slate-50 rounded-2xl border-none focus:ring-2 focus:ring-indigo-200 md:col-span-1" />
                        <button onClick={addRecord} className="bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition active:scale-95">記録を保存</button>
                    </div>

                    {/* 統計とグラフ */}
                    {stats && (
                        <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 space-y-6">
                            <div className="grid grid-cols-3 gap-4">
                                <div className="text-center">
                                    <p className="text-xs font-bold text-slate-400 mb-1">現在の体重</p>
                                    <p className="text-3xl font-black text-indigo-600">{stats.current}kg</p>
                                </div>
                                <div className="text-center">
                                    <p className="text-xs font-bold text-slate-400 mb-1">BMI</p>
                                    <p className="text-3xl font-black text-emerald-500">{stats.bmi || '--'}</p>
                                </div>
                                <div className="text-center">
                                    <p className="text-xs font-bold text-slate-400 mb-1">変化</p>
                                    <p className={`text-3xl font-black ${stats.change <= 0 ? 'text-blue-500' : 'text-rose-500'}`}>
                                        {stats.change > 0 ? '+' : ''}{stats.change.toFixed(1)}
                                    </p>
                                </div>
                            </div>
                            <div className="h-64 w-full pt-4">
                                <ResponsiveContainer width="100%" height="100%">
                                    <LineChart data={records}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                        <XAxis dataKey="date" hide />
                                        <YAxis domain={['dataMin - 2', 'dataMax + 2']} hide />
                                        <Tooltip contentStyle={{borderRadius: '16px', border: 'none', boxShadow: '0 10px 15px -3px rgba(0,0,0,0.1)'}} />
                                        <Line type="monotone" dataKey="weight" stroke="#4f46e5" strokeWidth={4} dot={{r: 4, fill: '#4f46e5', strokeWidth: 2, stroke: '#fff'}} activeDot={{r: 8}} />
                                        {goalWeight && <ReferenceLine y={parseFloat(goalWeight)} stroke="#f43f5e" strokeDasharray="8 8" />}
                                    </LineChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    )}

                    {/* 履歴リスト */}
                    <div className="space-y-3 pb-10">
                        <h2 className="text-sm font-black text-slate-400 px-2 uppercase tracking-widest">最近の記録</h2>
                        {[...records].reverse().map(r => (
                            <div key={r.id} className="bg-white rounded-2xl p-4 flex justify-between items-center shadow-sm border border-slate-50 group hover:border-indigo-100 transition">
                                <div>
                                    <p className="text-[10px] font-bold text-slate-400">{r.date} {r.time}</p>
                                    <p className="font-extrabold text-slate-700">{r.weight}kg <span className="font-medium text-sm text-slate-400 ml-2">{r.memo}</span></p>
                                </div>
                                <button onClick={() => setDeleteConfirm(r)} className="p-2 text-slate-200 hover:text-rose-400 transition opacity-0 group-hover:opacity-100">
                                    <Icon name="Trash2" />
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WeightTracker />);
    </script>
</body>
</html>
